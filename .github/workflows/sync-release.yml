name: Sync ChemBridge production source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore validated release source
        run: |
          python - <<'PY'
          import base64, gzip, json
          from pathlib import Path
          data = "".join([
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
            "",
          ])
          files = json.loads(gzip.decompress(base64.b64decode(data)))
          for name, encoded in files.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))
          PY
      - name: Commit synchronized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore app lib reports server
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden ChemBridge learning and admin flows"
          git push
