      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate and build GitHub Pages
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm test:migrations
          pnpm build:github-pages
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app db drizzle lib server scripts public docs package.json vite.github-pages.config.ts
          git diff --cached --quiet || git commit -m "feat: add presentations and assignments"
          git push
