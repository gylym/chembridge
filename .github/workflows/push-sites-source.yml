name: Push ChemBridge source to Sites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push exact source state to Sites
        env:
          SITES_REPO_TOKEN: ${{ secrets.SITES_REPO_TOKEN }}
        run: |
          test -n "$SITES_REPO_TOKEN"
          git remote add sites "https://git.chatgpt-team.site/5fa5c1f6-888d-4411-a957-edfbca3c82a1/appgprj_6a6b390500dc81a4965b84302aaaff05.git"
          git -c http.extraHeader="Authorization: Bearer $SITES_REPO_TOKEN" push sites HEAD:main
          git rev-parse HEAD
