services:
  postgres:
    image: postgres:17-alpine
    container_name: chembridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chembridge
      POSTGRES_USER: chembridge
      POSTGRES_PASSWORD: chembridge_dev
    ports:
      - "5432:5432"
    volumes:
      - chembridge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chembridge -d chembridge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chembridge_postgres_data:
